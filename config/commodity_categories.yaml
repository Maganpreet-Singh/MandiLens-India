
# =============================================================================
# MANDILENS INDIA
# COMMODITY CLASSIFICATION AND STANDARDIZATION REGISTRY
# =============================================================================
#
# File:
#   config/commodity_categories.yaml
#
# Purpose:
#   Define a nationwide agricultural commodity taxonomy, standardization
#   policies, category hierarchy, aliases, classification rules and
#   commodity validation requirements.
#
# Primary dataset:
#   DHIVAKARNAIDUSUNKARI/mandi-india-daily-prices-2001-2026
#
# Dataset characteristics:
#   - Publisher-reported 75,962,937 records.
#   - Publisher-reported 389 distinct commodity values.
#   - Original commodity names must be preserved.
#   - Complete local commodity inventory is still pending.
#
# DESIGN PRINCIPLES:
#   1. Support every commodity in the complete nationwide dataset.
#   2. Never restrict classification to a selected commodity shortlist.
#   3. Preserve the original source commodity name.
#   4. Never confuse commodity, variety and grade.
#   5. Do not assign unverified commodity mappings.
#   6. Prefer exact, reviewed mappings over fuzzy matching.
#   7. Retain unknown commodities in an unclassified category.
#   8. Keep classification rules reproducible and auditable.
#
# STATUS:
#   Taxonomy defined.
#   Actual commodity mapping pending dataset inventory audit.
#
# =============================================================================


# -----------------------------------------------------------------------------
# 1. CONFIGURATION METADATA
# -----------------------------------------------------------------------------

metadata:

  configuration_name: "MandiLens India Commodity Classification Registry"

  configuration_version: "1.0.0"

  schema_version: 1

  configuration_status: "development"

  project_name: "MandiLens India"

  description: >
    Central commodity taxonomy for organizing, standardizing and
    analyzing agricultural commodities available across Indian
    wholesale agricultural markets.

  classification_namespace: "mandilens"

  classification_method: "hierarchical_rule_based_with_reviewed_mappings"

  primary_dataset_id: >
    DHIVAKARNAIDUSUNKARI/mandi-india-daily-prices-2001-2026

  last_reviewed: null

  mapping_status: "pending_local_dataset_inventory"

  taxonomy_owner: "MandiLens India"


# -----------------------------------------------------------------------------
# 2. SOURCE DATA CONTEXT
# -----------------------------------------------------------------------------

source_context:

  primary_source: "mandi_huggingface"

  source_column:

    commodity: "Commodity"

    variety: "Variety"

    grade: "Grade"

    commodity_code: "Commodity_Code"

  source_column_verification:

    commodity_column_observed: true

    variety_column_observed: true

    grade_column_observed: true

    commodity_code_column_observed: true

    local_schema_verification: false

  publisher_reported_profile:

    distinct_commodity_count: 389

    actual_distinct_count_verified: false

    complete_inventory_available: false

    verification_status: "publisher_reported"

  source_data_policy:

    preserve_original_commodity_name: true

    preserve_original_variety_name: true

    preserve_original_grade_name: true

    preserve_original_commodity_code: true

    modify_original_source_columns: false

    create_standardized_columns_separately: true

  expected_output_columns:

    - "commodity_original"

    - "commodity_normalized"

    - "commodity_standardized"

    - "commodity_category"

    - "commodity_category_code"

    - "commodity_subcategory"

    - "commodity_subcategory_code"

    - "commodity_code_original"

    - "commodity_mapping_status"

    - "commodity_mapping_method"

    - "commodity_mapping_confidence"

    - "classification_version"


# -----------------------------------------------------------------------------
# 3. CLASSIFICATION PRINCIPLES
# -----------------------------------------------------------------------------

classification_principles:

  hierarchy:

    level_1: "commodity_category"

    level_2: "commodity_subcategory"

    level_3: "commodity_standardized"

    source_identity: "commodity_original"

  classification_requirements:

    support_all_source_commodities: true

    support_future_commodities: true

    support_regional_commodity_names: true

    support_spelling_variations: true

    support_historical_names: true

    support_product_forms: true

    support_processed_agricultural_products: true

    support_unclassified_values: true

  identification:

    commodity_is_primary_classification_unit: true

    variety_is_separate_dimension: true

    grade_is_separate_dimension: true

    commodity_code_is_reference_identifier: true

  mapping_policy:

    use_exact_approved_mapping_first: true

    use_approved_alias_mapping_second: true

    use_verified_code_mapping_when_available: true

    use_unreviewed_fuzzy_matching: false

    assign_unknown_values_to_fallback_category: true

    require_review_for_ambiguous_mappings: true

  source_integrity:

    preserve_raw_values: true

    preserve_original_case: true

    preserve_original_punctuation: true

    preserve_original_descriptors: true

    record_normalization_history: true


