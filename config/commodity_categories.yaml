# -----------------------------------------------------------------------------
# 5. COMMODITY NAME NORMALIZATION
# -----------------------------------------------------------------------------

normalization:

  enabled: true

  preserve_original_value: true

  create_normalized_value: true

  create_standardized_value: true

  text_processing:

    unicode_normalization: "NFC"

    trim_leading_whitespace: true

    trim_trailing_whitespace: true

    collapse_repeated_whitespace: true

    comparison_case: "casefold"

    preserve_original_case: true

    preserve_hyphens: true

    preserve_parentheses: true

    preserve_slashes: true

    preserve_comma_descriptors: true

  punctuation:

    remove_punctuation: false

    remove_brackets: false

    remove_parenthetical_text: false

    normalize_unicode_punctuation: true

  descriptors:

    preserve_whole_or_split: true

    preserve_fresh_or_dried: true

    preserve_product_form: true

    preserve_leaf_or_seed_identity: true

    preserve_source_parenthetical_descriptions: true

  normalization_rules:

    - rule_id: "NORM_001"
      name: "Whitespace normalization"
      operation: "trim_and_collapse_whitespace"

    - rule_id: "NORM_002"
      name: "Unicode normalization"
      operation: "unicode_nfc"

    - rule_id: "NORM_003"
      name: "Case-insensitive comparison"
      operation: "unicode_casefold"

  prohibited_operations:

    - "delete_source_commodity_descriptors"

    - "remove_whole_or_split_information"

    - "merge_fresh_and_dried_products_automatically"

    - "merge_leaf_and_seed_products_automatically"

    - "use_unreviewed_fuzzy_matching_as_final_mapping"

    - "overwrite_original_commodity_name"


# -----------------------------------------------------------------------------
# 6. APPROVED COMMODITY MAPPINGS
# -----------------------------------------------------------------------------
#
# The entries list intentionally starts empty.
#
# It will be populated after:
#   1. The complete dataset has been acquired.
#   2. All distinct commodity values have been extracted.
#   3. Commodity codes have been profiled.
#   4. Names and aliases have been reviewed.
#
# Do not manually invent a mapping for an unseen commodity.
# -----------------------------------------------------------------------------

commodity_mappings:

  mapping_version: "1.0.0"

  mapping_status: "pending_inventory_audit"

  complete_source_inventory_required: true

  require_manual_review: true

  require_category_reference: true

  require_subcategory_reference: true

  entries: []


# -----------------------------------------------------------------------------
# 7. ALIAS REGISTRY
# -----------------------------------------------------------------------------

alias_registry:

  enabled: true

  registry_status: "pending_inventory_audit"

  preserve_alias_provenance: true

  use_only_approved_aliases: true

  alias_resolution:

    exact_source_name_first: true

    approved_alias_second: true

    unresolved_alias_to_review: true

    fuzzy_similarity_is_suggestion_only: true

  entries: []

  example_policy:

    description: >
      Alias entries must be created from observed dataset values
      and manually reviewed before being used for classification.

    illustrative_pairs:

      - source_name: "Jowar"
        standardized_name: "Sorghum"
        status: "illustrative_only_not_approved"

      - source_name: "Bajra"
        standardized_name: "Pearl Millet"
        status: "illustrative_only_not_approved"


# -----------------------------------------------------------------------------
# 8. COMMODITY CODE MAPPING POLICY
# -----------------------------------------------------------------------------

commodity_code_mapping:

  enabled: true

  source_column: "Commodity_Code"

  mapping_status: "pending_inventory_audit"

  use_as_unique_global_commodity_identifier: false

  verify_code_to_name_relationship: true

  verify_one_to_one_relationship: true

  detect_one_code_multiple_names: true

  detect_multiple_codes_one_name: true

  preserve_original_code: true

  generate_internal_commodity_id: true

  internal_identifier:

    format: "stable_string_identifier"

    derive_from: "approved_standardized_commodity_identity"

    independent_of_source_row_order: true

  mapping_policy:

    use_code_for_classification_only_after_validation: true

    use_exact_commodity_name_as_fallback: true

    investigate_code_name_conflicts: true

    never_silently_merge_conflicting_codes: true


# -----------------------------------------------------------------------------
# 9. CLASSIFICATION RESOLUTION ORDER
# -----------------------------------------------------------------------------

classification_rules:

  enabled: true

  default_category: "unclassified_pending_review"

  resolution_priority:

    - priority: 1
      method: "exact_approved_commodity_mapping"
      automatic: true
      confidence: 1.0

    - priority: 2
      method: "exact_approved_alias_mapping"
      automatic: true
      confidence: 1.0

    - priority: 3
      method: "verified_commodity_code_mapping"
      automatic: true
      confidence: 1.0
      requires_code_validation: true

    - priority: 4
      method: "reviewed_manual_classification"
      automatic: true
      confidence: 1.0
      requires_approval: true

    - priority: 5
      method: "unclassified_fallback"
      automatic: true
      confidence: 0.0

  matching:

    case_sensitive: false

    strip_outer_whitespace: true

    normalize_unicode: true

    allow_exact_alias_match: true

    allow_partial_string_match: false

    allow_substring_category_assignment: false

    allow_fuzzy_auto_classification: false

  confidence_policy:

    approved_exact_match: 1.0

    approved_alias_match: 1.0

    verified_code_match: 1.0

    manually_approved_match: 1.0

    suggested_fuzzy_match: null

    unclassified: 0.0

  ambiguous_classification:

    assign_automatically: false

    send_for_review: true

    preserve_candidate_categories: true

    preserve_source_value: true


# -----------------------------------------------------------------------------
# 10. VARIETY AND GRADE HANDLING
# -----------------------------------------------------------------------------

product_attributes:

  variety:

    source_column: "Variety"

    classification_dimension: "product_variety"

    include_in_commodity_category: false

    preserve_original_value: true

    standardization_status: "future_workstream"

    allow_variety_specific_analysis: true

  grade:

    source_column: "Grade"

    classification_dimension: "product_grade"

    include_in_commodity_category: false

    preserve_original_value: true

    standardization_status: "future_workstream"

    allow_grade_specific_analysis: true

  product_identity:

    primary_identity: "standardized_commodity"

    secondary_identity: "variety"

    tertiary_identity: "grade"

    do_not_merge_different_product_forms: true


# -----------------------------------------------------------------------------
# 11. SEASONALITY METADATA
# -----------------------------------------------------------------------------

seasonality:

  enabled: true

  classification_status: "future_enrichment"

  supported_seasons:

    kharif:
      label: "Kharif"
      season_code: "KHARIF"

    rabi:
      label: "Rabi"
      season_code: "RABI"

    zaid:
      label: "Zaid"
      season_code: "ZAID"

    perennial:
      label: "Perennial"
      season_code: "PERENNIAL"

    region_dependent:
      label: "Region Dependent"
      season_code: "REGION_DEPENDENT"

    unknown:
      label: "Unknown"
      season_code: "UNKNOWN"

  rules:

    do_not_assume_one_season_for_all_regions: true

    support_multiple_seasons_per_commodity: true

    support_state_specific_crop_calendars: true

    support_district_specific_crop_calendars: true

    support_manual_review: true

    require_external_agricultural_reference: true

    never_infer_crop_season_from_price_pattern_alone: true

  commodity_season_mapping:

    status: "pending_future_research"

    entries: []


# -----------------------------------------------------------------------------
# 12. CATEGORY METADATA AND ANALYTICAL ATTRIBUTES
# -----------------------------------------------------------------------------

analytical_attributes:

  price_analysis:

    enabled: true

    supported_metrics:

      - "minimum_price"

      - "maximum_price"

      - "modal_price"

      - "daily_price_change"

      - "monthly_average_price"

      - "annual_average_price"

      - "price_volatility"

      - "seasonal_price_pattern"

  market_analysis:

    enabled: true

    supported_dimensions:

      - "state"

      - "district"

      - "market"

      - "commodity_category"

      - "commodity_subcategory"

      - "commodity_standardized"

      - "variety"

      - "grade"

  forecasting:

    enabled: true

    category_level_forecasting: true

    commodity_level_forecasting: true

    variety_level_forecasting: true

    require_sufficient_historical_observations: true

    require_individual_series_eligibility_check: true

    category_aggregation_does_not_imply_forecast_eligibility: true

  commodity_comparison:

    allow_comparison_within_category: true

    allow_cross_category_comparison: false

    require_price_unit_compatibility: true

    require_same_product_form: true


# -----------------------------------------------------------------------------
# 13. DATA QUALITY RULES
# -----------------------------------------------------------------------------

data_quality:

  enabled: true

  commodity_validation:

    reject_null_commodity_name: false

    flag_null_commodity_name: true

    flag_empty_commodity_name: true

    detect_duplicate_normalized_names: true

    detect_unmapped_commodities: true

    detect_unknown_category_codes: true

    detect_unknown_subcategory_codes: true

    detect_mapping_conflicts: true

    detect_ambiguous_aliases: true

    detect_invalid_category_references: true

  mapping_completeness:

    calculate_total_distinct_commodities: true

    calculate_approved_mappings: true

    calculate_unmapped_commodities: true

    calculate_mapping_coverage_percentage: true

    target_coverage_percentage: 100.0

    target_requires_approved_mappings: true

  historical_integrity:

    preserve_historical_commodity_names: true

    detect_name_changes_over_time: true

    detect_code_changes_over_time: true

    document_mapping_version_changes: true

  severity:

    missing_commodity_name: "high"

    unmapped_commodity: "medium"

    conflicting_commodity_mapping: "critical"

    invalid_category_reference: "critical"

    ambiguous_alias: "high"

    duplicate_standardized_identity: "high"


# -----------------------------------------------------------------------------
# 14. REVIEW AND APPROVAL WORKFLOW
# -----------------------------------------------------------------------------

review_workflow:

  enabled: true

  mapping_review_required: true

  review_stages:

    - "source_inventory_extraction"

    - "distinct_name_profiling"

    - "normalization_candidate_generation"

    - "alias_candidate_review"

    - "category_assignment"

    - "subcategory_assignment"

    - "commodity_code_validation"

    - "final_mapping_approval"

  approvals:

    require_approved_category: true

    require_approved_subcategory: true

    require_standardized_name: true

    require_source_name_reference: true

    record_reviewer: true

    record_review_timestamp: true

    record_review_notes: true

  audit:

    preserve_previous_mappings: true

    maintain_mapping_change_history: true

    record_old_category: true

    record_new_category: true

    record_change_reason: true


# -----------------------------------------------------------------------------
# 15. OUTPUT CONFIGURATION
# -----------------------------------------------------------------------------

outputs:

  directory: "data/metadata/commodity_classification"

  mapping_directory: "data/processed/commodity_mappings"

  reports_directory: "reports/commodity_classification"

  files:

    commodity_inventory: >
      data/metadata/commodity_classification/commodity_inventory.csv

    approved_mapping_registry: >
      data/processed/commodity_mappings/approved_commodity_mappings.csv

    alias_registry: >
      data/processed/commodity_mappings/commodity_aliases.csv

    category_summary: >
      data/metadata/commodity_classification/category_summary.json

    unmapped_commodities: >
      data/metadata/commodity_classification/unmapped_commodities.csv

    classification_audit: >
      data/metadata/commodity_classification/classification_audit.json

    data_dictionary: >
      docs/commodity_taxonomy.md

  report_generation:

    generate_inventory_report: true

    generate_category_distribution: true

    generate_unmapped_report: true

    generate_mapping_coverage_report: true

    generate_category_hierarchy_report: true


# -----------------------------------------------------------------------------
# 16. VERSIONING AND CHANGE MANAGEMENT
# -----------------------------------------------------------------------------

versioning:

  enabled: true

  taxonomy_version: "1.0.0"

  mapping_version: "1.0.0"

  semantic_versioning: true

  breaking_changes_require_major_version: true

  category_changes_require_audit: true

  alias_changes_require_audit: true

  preserve_historical_mapping_versions: true

  never_silently_reclassify_historical_records: true

  record_effective_date_of_mapping_changes: true


# -----------------------------------------------------------------------------
# 17. IMPLEMENTATION STATUS
# -----------------------------------------------------------------------------

implementation_status:

  taxonomy_defined: true

  category_hierarchy_defined: true

  normalization_policy_defined: true

  classification_rules_defined: true

  unclassified_fallback_defined: true

  commodity_alias_registry_created: true

  commodity_mapping_registry_created: true

  actual_commodity_inventory_extracted: false

  all_commodity_mappings_approved: false

  commodity_code_relationships_verified: false

  seasonality_mapping_completed: false

  local_dataset_validation_completed: false

  ready_for_commodity_inventory_audit: true


# =============================================================================
# END OF COMMODITY CLASSIFICATION CONFIGURATION
# =============================================================================
