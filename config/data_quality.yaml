    chronological_train_test_split: true

    no_future_information_in_features: true

    verify_target_column: true

    verify_feature_data_types: true

    verify_feature_missingness: true

    detect_constant_features: true

    detect_high_cardinality_features: true

    detect_duplicate_training_records: true

    validate_training_validation_test_overlap: true

    preserve_temporal_order: true

  forecasting:

    target_column: "Modal_Price"

    time_column: "Arrival_Date"

    entity_grouping:

      - "Market"
      - "Commodity"

    require_minimum_historical_observations: true

    minimum_observations: 30

    prevent_random_temporal_split: true

    prevent_future_to_past_training: true

    prevent_test_data_in_preprocessing: true

    fit_transformers_on_training_data_only: true

  limitations:

    arrival_quantity_available: false

    arrival_quantity_verification: "publisher_reported_not_available"

    arrival_quantity_prediction_allowed: false

    transport_cost_prediction_allowed: false

    price_unit_verification_required: true


# -----------------------------------------------------------------------------
# 18. DATA CLEANING AND CORRECTION POLICY
# -----------------------------------------------------------------------------

cleaning_policy:

  enabled: true

  operating_mode: "non_destructive"

  raw_data:

    immutable: true

    overwrite_allowed: false

    delete_allowed: false

  cleaning_operations:

    trim_string_whitespace: true

    standardize_unicode: true

    normalize_comparison_case: true

    standardize_commodity_names: true

    standardize_geographical_names: true

    convert_valid_dates: true

    convert_valid_numeric_types: true

  restricted_operations:

    delete_null_rows: false

    delete_duplicates_automatically: false

    delete_price_outliers: false

    replace_missing_prices_with_zero: false

    replace_missing_prices_with_mean: false

    replace_missing_prices_with_median: false

    interpolate_market_prices_automatically: false

    invent_missing_dates: false

    silently_correct_invalid_prices: false

  correction_tracking:

    maintain_before_value: true

    maintain_after_value: true

    maintain_rule_id: true

    maintain_reason: true

    maintain_timestamp: true

    maintain_processing_version: true

    maintain_source_record_reference: true


# -----------------------------------------------------------------------------
# 19. ISSUE MANAGEMENT
# -----------------------------------------------------------------------------

issue_management:

  enabled: true

  severity_levels:

    critical:

      description: >
        Issues that compromise data integrity or make a core
        analytical operation unsafe.

      pipeline_action: "block_affected_dataset"

    high:

      description: >
        Major issues requiring investigation before the affected
        records are accepted for important analysis.

      pipeline_action: "quarantine_affected_records"

    medium:

      description: >
        Suspicious or incomplete records that require monitoring
        and potential manual review.

      pipeline_action: "flag_and_report"

    low:

      description: >
        Minor formatting or metadata inconsistencies.

      pipeline_action: "report"

    informational:

      description: >
        Observations that provide useful context without
        necessarily representing a quality defect.

      pipeline_action: "log"

  issue_registry:

    enabled: true

    generate_unique_issue_id: true

    record_rule_id: true

    record_source_file: true

    record_source_row_reference: true

    record_column_name: true

    record_original_value: true

    record_detected_value: true

    record_severity: true

    record_detection_timestamp: true

    record_resolution_status: true

    record_resolution_reason: true

  issue_statuses:

    - "open"

    - "under_review"

    - "approved"

    - "corrected"

    - "excluded"

    - "false_positive"

    - "resolved"

  issue_actions:

    preserve_source_record: true

    allow_manual_review: true

    require_resolution_reason: true

    maintain_issue_history: true


# -----------------------------------------------------------------------------
# 20. QUALITY SCORING FRAMEWORK
# -----------------------------------------------------------------------------

quality_scoring:

  enabled: true

  scoring_method: "weighted_dimension_score"

  score_range:

    minimum: 0

    maximum: 100

  dimensions:

    completeness:

      weight: 20

      description: "Percentage of required fields with valid values."

    validity:

      weight: 20

      description: "Compliance with data types and validation rules."

    consistency:

      weight: 20

      description: "Agreement between related fields and references."

    uniqueness:

      weight: 15

      description: "Absence of unintended duplicate records."

    accuracy_proxy:

      weight: 10

      description: >
        Internal plausibility and consistency checks.
        This is not a measurement of ground-truth accuracy.

    timeliness:

      weight: 10

      description: "Availability and freshness relative to source expectations."

    integrity:

      weight: 5

      description: "File and dataset integrity verification."

  calculation:

    weights_must_sum_to_100: true

    calculate_overall_score: true

    calculate_dimension_scores: true

    calculate_file_level_scores: true

    calculate_partition_level_scores: true

    calculate_dataset_level_score: true

    exclude_unassessed_dimensions_from_interpretation: true

    report_score_coverage: true

  rating:

    excellent:

      minimum_score: 95

      maximum_score: 100

    good:

      minimum_score: 85

      maximum_score: 94.99

    acceptable:

      minimum_score: 70

      maximum_score: 84.99

    poor:

      minimum_score: 50

      maximum_score: 69.99

    critical:

      minimum_score: 0

      maximum_score: 49.99

  acceptance:

    minimum_acceptable_score: 85

    critical_issue_count_must_equal_zero: true

    require_all_required_dimensions_assessed: true

    permit_manual_override: true

    manual_override_requires_reason: true

    do_not_use_score_to_hide_critical_issues: true


# -----------------------------------------------------------------------------
# 21. DATASET ACCEPTANCE GATES
# -----------------------------------------------------------------------------

acceptance_gates:

  enabled: true

  stages:

    raw_ingestion:

      required:

        - "file_exists"

        - "file_size_valid"

        - "parquet_metadata_readable"

        - "checksum_recorded"

      block_on_failure: true

    schema_validation:

      required:

        - "expected_columns_inspected"

        - "data_types_inspected"

        - "schema_changes_documented"

      block_on_failure: true

    data_validation:

      required:

        - "missing_values_profiled"

        - "duplicate_records_profiled"

        - "price_rules_executed"

        - "date_rules_executed"

        - "commodity_rules_executed"

        - "geographical_rules_executed"

      block_on_failure: true

    cleaning:

      required:

        - "cleaning_operations_logged"

        - "original_data_preserved"

        - "corrections_audited"

      block_on_failure: true

    machine_learning:

      required:

        - "target_validated"

        - "feature_leakage_checked"

        - "temporal_split_validated"

        - "training_data_quality_approved"

      block_on_failure: true

  final_acceptance:

    require_quality_report: true

    require_validation_manifest: true

    require_zero_unresolved_critical_issues: true

    require_manual_review_of_high_severity_issues: true

    require_source_provenance: true


# -----------------------------------------------------------------------------
# 22. INCREMENTAL VALIDATION
# -----------------------------------------------------------------------------

incremental_validation:

  enabled: true

  strategy: "file_and_partition_based"

  identify_new_files: true

  identify_modified_files: true

  identify_deleted_remote_files: true

  compare_file_checksums: true

  validate_only_changed_files_when_safe: true

  maintain_previous_validation_results: true

  require_full_validation_after_schema_change: true

  require_full_validation_after_rule_change: true

  periodic_full_audit: true

  full_audit_frequency: "monthly"

  compare_incremental_results_with_baseline: true


# -----------------------------------------------------------------------------
# 23. REPORTING AND MONITORING
# -----------------------------------------------------------------------------

reporting:

  enabled: true

  report_directory: "reports/data_quality"

  metadata_directory: "data/metadata/data_quality"

  formats:

    - "json"

    - "csv"

    - "html"

  reports:

    dataset_quality_summary:

      enabled: true

      filename: "dataset_quality_summary.json"

    column_quality_report:

      enabled: true

      filename: "column_quality_report.csv"

    missing_values_report:

      enabled: true

      filename: "missing_values_report.csv"

    duplicate_report:

      enabled: true

      filename: "duplicate_records_report.csv"

    price_validation_report:

      enabled: true

      filename: "price_validation_report.csv"

    date_validation_report:

      enabled: true

      filename: "date_validation_report.csv"

    commodity_validation_report:

      enabled: true

      filename: "commodity_validation_report.csv"

    geographical_validation_report:

      enabled: true

      filename: "geographical_validation_report.csv"

    anomaly_report:

      enabled: true

      filename: "price_anomaly_report.csv"

    schema_report:

      enabled: true

      filename: "schema_validation_report.json"

    issue_registry:

      enabled: true

      filename: "quality_issues.csv"

    validation_manifest:

      enabled: true

      filename: "validation_manifest.json"

    html_dashboard:

      enabled: true

      filename: "data_quality_dashboard.html"

  visualizations:

    enabled: true

    save_plots: true

    output_directory: "reports/data_quality/figures"

    formats:

      - "png"

      - "html"

    charts:

      - "missing_value_distribution"

      - "duplicate_record_distribution"

      - "price_distribution"

      - "price_outlier_distribution"

      - "yearly_record_distribution"

      - "commodity_quality_distribution"

      - "state_quality_distribution"

      - "quality_score_by_dimension"

      - "validation_failure_distribution"

      - "schema_change_history"

  reporting_rules:

    include_execution_timestamp: true

    include_dataset_revision: true

    include_file_count: true

    include_record_count: true

    include_quality_score: true

    include_validation_status: true

    include_issue_counts: true

    include_unresolved_issues: true

    include_failed_rules: true


# -----------------------------------------------------------------------------
# 24. AUDIT TRAIL AND GOVERNANCE
# -----------------------------------------------------------------------------

audit:

  enabled: true

  audit_directory: "data/metadata/data_quality/audit"

  maintain_validation_history: true

  maintain_rule_execution_history: true

  maintain_cleaning_history: true

  maintain_manual_review_history: true

  record:

    - "execution_id"

    - "dataset_id"

    - "source_revision"

    - "input_file"

    - "input_checksum"

    - "rule_id"

    - "rule_version"

    - "execution_timestamp"

    - "execution_duration"

    - "records_processed"

    - "records_flagged"

    - "records_quarantined"

    - "records_corrected"

    - "validation_result"

    - "software_versions"

  immutable_audit_log: true

  preserve_previous_audits: true

  never_overwrite_historical_audits: true


# -----------------------------------------------------------------------------
# 25. PERFORMANCE AND RESOURCE MANAGEMENT
# -----------------------------------------------------------------------------

performance:

  enabled: true

  processing_strategy: "memory_efficient_columnar_processing"

  preferred_engines:

    - "DuckDB"

    - "Polars"

    - "PyArrow"

  pandas:

    use_for_full_dataset: false

    use_for_small_reports: true

    use_for_sample_analysis: true

  optimization:

    use_column_projection: true

    use_predicate_pushdown: true

    use_lazy_execution: true

    avoid_repeated_full_dataset_scans: true

    reuse_validated_metadata: true

    cache_safe_intermediate_results: true

    use_partition_pruning: true

    use_parallel_file_processing: true

  resource_limits:

    batch_size_records: 500000

    maximum_concurrent_file_validations: 4

    memory_limit: "configurable"

    cpu_threads: "configurable"

    spill_to_disk_when_required: true

    temporary_directory: "data/temp/data_quality"

  logging:

    log_execution_duration: true

    log_memory_usage: true

    log_processed_records: true

    log_processing_throughput: true

    log_failed_batches: true


# -----------------------------------------------------------------------------
# 26. ERROR HANDLING
# -----------------------------------------------------------------------------

error_handling:

  enabled: true

  retry_transient_errors: true

  maximum_retries: 3

  exponential_backoff: true

  record_exception_details: true

  preserve_failed_batch_information: true

  preserve_failed_file_information: true

  continue_after_noncritical_errors: true

  stop_on_critical_integrity_errors: true

  stop_on_unrecoverable_schema_errors: true

  prevent_partial_results_from_being_marked_approved: true

  error_directory: "logs/data_quality/errors"


# -----------------------------------------------------------------------------
# 27. SECURITY AND PRIVACY
# -----------------------------------------------------------------------------

security:

  enabled: true

  never_log_api_credentials: true

  never_log_environment_secrets: true

  restrict_raw_data_modification: true

  preserve_original_source_files: true

  validate_external_reference_files: true

  prevent_untrusted_yaml_execution: true

  record_access_to_sensitive_files: true


# -----------------------------------------------------------------------------
# 28. IMPLEMENTATION STATUS
# -----------------------------------------------------------------------------

implementation_status:

  metadata_defined: true

  validation_engine_defined: true

  schema_rules_defined: true

  file_integrity_rules_defined: true

  missing_value_rules_defined: true

  duplicate_detection_defined: true

  data_type_rules_defined: true

  price_validation_defined: true

  date_validation_defined: true

  geographical_validation_defined: true

  commodity_validation_defined: true

  anomaly_detection_defined: true

  cross_field_validation_defined: true

  historical_consistency_defined: true

  ml_readiness_defined: true

  cleaning_policy_defined: true

  issue_management_defined: true

  quality_scoring_defined: true

  acceptance_gates_defined: true

  incremental_validation_defined: true

  reporting_defined: true

  audit_trail_defined: true

  actual_dataset_validation_completed: false

  production_validation_engine_implemented: false

  ready_for_validation_engine_development: true


# =============================================================================
# END OF DATA QUALITY CONFIGURATION
# =============================================================================
