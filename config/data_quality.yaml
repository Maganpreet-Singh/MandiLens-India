# -----------------------------------------------------------------------------
# 13. STATISTICAL ANOMALY DETECTION
# -----------------------------------------------------------------------------

anomaly_detection:

  enabled: true

  purpose: >
    Identify unusual market price observations and suspicious
    statistical patterns without automatically treating them
    as invalid records.

  methods:

    interquartile_range:

      enabled: true

      multiplier: 1.5

      extreme_multiplier: 3.0

      grouping:

        - "Commodity"
        - "Market"

    modified_z_score:

      enabled: true

      threshold: 3.5

      minimum_observations: 30

    rolling_median:

      enabled: true

      window_days: 30

      minimum_observations: 7

      deviation_threshold_percentage: 50.0

    percentile_analysis:

      enabled: true

      lower_percentile: 0.1

      upper_percentile: 99.9

  grouping:

    primary:

      - "Commodity"
      - "Market"

    secondary:

      - "Commodity"
      - "State"

  minimum_observations:

    global: 30

    commodity_market: 30

  handling:

    classify_as_suspicious_not_invalid: true

    preserve_original_observation: true

    require_investigation_before_exclusion: true

    record_detection_algorithm: true

    record_threshold: true

    record_reference_group: true

    prevent_outlier_based_automatic_deletion: true


