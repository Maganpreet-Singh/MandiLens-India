
# =============================================================================
# MANDILENS INDIA
# CENTRAL DATA SOURCE REGISTRY
# =============================================================================
#
# Project:
#   MandiLens India
#
# File:
#   config/data_sources.yaml
#
# Purpose:
#   Central registry for all external datasets, source repositories,
#   API integrations, download policies, provenance and data acquisition.
#
# Primary dataset:
#   DHIVAKARNAIDUSUNKARI/mandi-india-daily-prices-2001-2026
#
# Important:
#   - Download the complete historical dataset.
#   - Never filter the master dataset by state or commodity.
#   - Never modify original source files.
#   - Discover remote files instead of assuming every filename.
#   - Verify the actual schema locally before transformations.
#   - Keep credentials outside version control.
#   - Do not assume that optional external APIs are operational.
#
# =============================================================================


# -----------------------------------------------------------------------------
# 1. CONFIGURATION METADATA
# -----------------------------------------------------------------------------

metadata:

  configuration_name: "MandiLens India Data Source Registry"

  configuration_version: "1.0.0"

  configuration_status: "development"

  description: >
    Central configuration for agricultural market datasets,
    historical mandi prices, official government data,
    weather integration and future agricultural data sources.

  project_name: "MandiLens India"

  schema_version: 1

  primary_source_id: "mandi_huggingface"

  default_timezone: "Asia/Kolkata"

  default_currency: "INR"


# -----------------------------------------------------------------------------
# 2. GLOBAL DATA SOURCE POLICIES
# -----------------------------------------------------------------------------

global_policies:

  # Master dataset requirements

  dataset_scope:

    geographical_scope: "nationwide"

    include_all_available_states: true

    include_all_available_union_territories: true

    include_all_available_districts: true

    include_all_available_markets: true

    include_all_available_commodities: true

    include_all_available_varieties: true

    complete_historical_coverage: true

  # Source preservation

  source_preservation:

    preserve_original_files: true

    overwrite_original_files: false

    delete_raw_data_after_processing: false

    modify_source_schema: false

    maintain_source_provenance: true

    maintain_download_manifest: true

  # Download configuration

  download:

    resume_interrupted_downloads: true

    skip_verified_existing_files: true

    verify_downloaded_files: true

    generate_download_manifest: true

    preserve_remote_directory_structure: true

    overwrite_existing_downloads: false

    retry_failed_downloads: true

    maximum_retries: 5

    retry_backoff_seconds: 2

    request_timeout_seconds: 120

    concurrent_downloads: 4

  # Network behavior

  network:

    use_https: true

    follow_redirects: true

    verify_ssl_certificates: true

    connection_timeout_seconds: 30

    read_timeout_seconds: 120

  # Data integrity

  integrity:

    calculate_sha256: true

    record_file_size: true

    record_file_checksum: true

    record_remote_revision: true

    validate_parquet_files: true

    detect_missing_files: true

    detect_duplicate_files: true

    verify_row_counts: true

    never_assume_expected_row_count_is_actual: true

  # Data processing restrictions

  processing:

    use_duckdb_for_large_scale_queries: true

    use_polars_for_large_scale_transformations: true

    avoid_full_dataset_pandas_loading: true

    process_files_incrementally: true

    support_partitioned_parquet: true

    preserve_raw_data_types: true


# -----------------------------------------------------------------------------
# 3. SOURCE REGISTRY
# -----------------------------------------------------------------------------

sources:


  # ===========================================================================
  # SOURCE 01 — PRIMARY HISTORICAL MANDI DATASET
  # ===========================================================================

  mandi_huggingface:

    enabled: true

    required: true

    priority: 1

    source_id: "mandi_huggingface"

    source_name: "India Mandi Daily Commodity Prices (2001-2026)"

    source_type: "historical_dataset"

    source_category: "agricultural_market_prices"

    source_role: "primary_master_dataset"

    verification_status: "repository_listing_verified_local_download_pending"

    description: >
      Historical agricultural commodity market prices from Indian
      wholesale mandis, covering available states, districts,
      markets, commodities, varieties and grades.

    # -----------------------------------------------------------------------
    # Repository identification
    # -----------------------------------------------------------------------

    repository:

      provider: "Hugging Face"

      provider_type: "dataset_repository"

      repo_id: "DHIVAKARNAIDUSUNKARI/mandi-india-daily-prices-2001-2026"

      repo_type: "dataset"

      revision: "main"

      dataset_url: >
        https://huggingface.co/datasets/DHIVAKARNAIDUSUNKARI/mandi-india-daily-prices-2001-2026

      data_card_url: >
        https://huggingface.co/datasets/DHIVAKARNAIDUSUNKARI/mandi-india-daily-prices-2001-2026

      revision_policy:

        revision_is_mutable: true

        resolve_commit_before_download: true

        record_resolved_commit_hash: true

        use_resolved_commit_for_reproducibility: true

        automatically_switch_to_latest_revision: false

    # -----------------------------------------------------------------------
    # Published dataset profile
    # -----------------------------------------------------------------------

    published_profile:

      record_count:

        value: 75962937

        approximate: false

        verification: "publisher_reported_not_locally_verified"

      historical_period:

        start_year: 2001

        end_year: 2026

        verification: "publisher_reported"

      file_format: "parquet"

      reported_file_count: 26

      repository_size_mb: 853

      dataset_split: "train"

      geographical_coverage: "India"

      reported_unique_values:

        states: 34

        districts: 642

        commodities: 389

      verification_policy:

        verify_actual_row_count: true

        verify_actual_file_count: true

        verify_actual_date_range: true

        verify_geographical_coverage: true

        verify_commodity_coverage: true

    # -----------------------------------------------------------------------
    # Remote file discovery
    # -----------------------------------------------------------------------

    repository_layout:

      observed_data_directory: "data/mandi_daily_by_year/"

      primary_format: ".parquet"

      discovery_method: "repository_file_listing"

      discovery_required: true

      include_all_matching_files: true

      recursive_discovery: true

      preserve_remote_relative_paths: true

      selection_policy: "all_dataset_parquet_files"

      restrict_by_year: false

      restrict_by_state: false

      restrict_by_district: false

      restrict_by_commodity: false

      restrict_by_market: false

      restrict_by_variety: false

      use_hardcoded_complete_file_list: false

      observed_example_file:

        remote_path: "data/mandi_daily_by_year/mandi_daily_2025.parquet"

        size_mb: 71.9

        sha256: "65a848dfc4be3f84a911e5375abfa5d67481cf547c6a9ae382932d9166bb5e93"

        verification_scope: "single_reference_file_only"

        observation_status: "repository_file_page_verified"

    # -----------------------------------------------------------------------
    # Observed dataset schema
    # -----------------------------------------------------------------------

    observed_schema:

      source: "huggingface_dataset_viewer"

      observation_status: "viewer_schema_observed_local_verification_pending"

      schema_verified_locally: false

      columns:

        - name: "State"
          observed_type: "string"

        - name: "District"
          observed_type: "string"

        - name: "Market"
          observed_type: "string"

        - name: "Commodity"
          observed_type: "string"

        - name: "Variety"
          observed_type: "string"

        - name: "Grade"
          observed_type: "string"

        - name: "Arrival_Date"
          observed_type: "date32"

        - name: "Min_Price"
          observed_type: "float64"

        - name: "Max_Price"
          observed_type: "float64"

        - name: "Modal_Price"
          observed_type: "float64"

        - name: "Commodity_Code"
          observed_type: "int64"

      schema_enforcement:

        enforce_before_local_audit: false

        use_observed_schema_as_initial_reference: true

        discover_actual_column_names: true

        discover_actual_data_types: true

        detect_additional_columns: true

        detect_missing_columns: true

        detect_type_mismatches: true

        document_schema_changes: true

      known_data_limitations:

        arrival_quantity:

          available: false

          verification: "publisher_dataset_card_statement"

          implication: >
            Arrival quantity or volume prediction cannot be performed
            using this dataset alone.

        price_unit:

          value: null

          verification: "pending_source_documentation"

          instruction: >
            Verify the original source unit before presenting prices
            or computing financial comparisons.

    # -----------------------------------------------------------------------
    # Dataset capabilities
    # -----------------------------------------------------------------------

    analytical_capabilities:

      supported:

        - "historical_price_analysis"

        - "national_market_analysis"

        - "state_wise_price_analysis"

        - "district_wise_price_analysis"

        - "mandi_price_comparison"

        - "commodity_price_analysis"

        - "variety_level_analysis"

        - "grade_level_analysis"

        - "seasonality_analysis"

        - "price_volatility_analysis"

        - "time_series_forecasting"

        - "market_price_decision_support"

      unsupported_without_additional_data:

        - "arrival_quantity_forecasting"

        - "arrival_volume_analysis"

        - "actual_farmer_profit_calculation"

        - "transport_cost_optimization"

        - "farm_level_production_forecasting"

    # -----------------------------------------------------------------------
    # Authentication and access
    # -----------------------------------------------------------------------

    access:

      access_method: "huggingface_hub"

      public_repository_expected: true

      authentication_required: false

      token_optional: true

      token_environment_variable: "HF_TOKEN"

      library: "huggingface_hub"

      recommended_download_method: "snapshot_download"

      recommended_listing_method: "HfApi.list_repo_files"

    # -----------------------------------------------------------------------
    # Download strategy
    # -----------------------------------------------------------------------

    acquisition:

      enabled: true

      acquisition_mode: "complete_repository_dataset_file_discovery"

      download_strategy: "discover_then_download"

      steps:

        - "Resolve repository revision."

        - "List available repository files."

        - "Identify all Parquet dataset files."

        - "Verify remote file inventory."

        - "Download every identified dataset Parquet file."

        - "Preserve the original directory structure."

        - "Calculate local file checksums."

        - "Generate the source manifest."

        - "Verify downloaded Parquet metadata."

        - "Compare local inventory with remote inventory."

      include_extensions:

        - ".parquet"

      exclude_extensions: []

      filtering:

        enabled: false

        allow_year_filtering: false

        allow_state_filtering: false

        allow_commodity_filtering: false

        allow_district_filtering: false

      incremental_download:

        enabled: true

        compare_remote_revision: true

        compare_file_size: true

        compare_file_hash_when_available: true

        redownload_modified_files: true

        preserve_previous_snapshot: true

    # -----------------------------------------------------------------------
    # Local storage
    # -----------------------------------------------------------------------

    storage:

      raw_directory: "data/raw/mandi_india_daily_prices"

      staging_directory: "data/temp/mandi_india_daily_prices"

      metadata_directory: "data/metadata/mandi_india_daily_prices"

      downloaded_file_manifest: >
        data/metadata/mandi_india_daily_prices/source_manifest.json

      checksum_manifest: >
        data/metadata/mandi_india_daily_prices/checksums.csv

      schema_report: >
        data/metadata/mandi_india_daily_prices/schema_report.json

      inventory_report: >
        reports/dataset_inventory.html

      file_policy:

        format: "parquet"

        preserve_remote_paths: true

        preserve_original_files: true

        overwrite_existing_files: false

        delete_raw_files: false

    # -----------------------------------------------------------------------
    # Integrity verification
    # -----------------------------------------------------------------------

    validation:

      enabled: true

      checks:

        - "repository_revision_recorded"

        - "remote_file_inventory_created"

        - "local_file_inventory_created"

        - "expected_files_downloaded"

        - "file_size_validation"

        - "sha256_checksum_validation"

        - "parquet_readability"

        - "parquet_schema_inspection"

        - "actual_row_count_calculation"

        - "date_range_verification"

      fail_on_missing_files: true

      fail_on_empty_files: true

      fail_on_unreadable_parquet: true

      fail_on_checksum_mismatch: true

      fail_on_unexpected_schema_change: false

      require_manual_review_for_schema_changes: true

    # -----------------------------------------------------------------------
    # Licensing and attribution
    # -----------------------------------------------------------------------

    licensing:

      huggingface_license_field: "other"

      upstream_license_claim: "Government Open Data License - India (GODL-India)"

      upstream_license_url: "https://www.data.gov.in/Godl"

      license_verification_required: true

      verify_dataset_card: true

      verify_repository_license_file: true

      verify_upstream_license: true

      attribution_required: true

      attribution:

        original_provider: "AGMARKNET"

        government_department: >
          Ministry of Agriculture and Farmers Welfare,
          Government of India

        original_portal: "data.gov.in"

        dataset_compilation: "Manas Khandelwal"

        repository_provider: "Hugging Face"

    # -----------------------------------------------------------------------
    # Source update policy
    # -----------------------------------------------------------------------

    refresh:

      automatic_refresh: false

      default_refresh_method: "manual_snapshot_audit"

      detect_new_remote_files: true

      detect_modified_remote_files: true

      preserve_historical_snapshots: true

      require_inventory_comparison: true

      require_validation_before_promotion: true


  # ===========================================================================
  # SOURCE 02 — OFFICIAL GOVERNMENT DATA PORTAL
  # ===========================================================================

  data_gov_in:

    enabled: false

    required: false

    priority: 2

    source_id: "data_gov_in"

    source_name: "Open Government Data Platform India"

    source_type: "government_open_data"

    source_category: "agricultural_market_prices"

    source_role: "original_source_reference_and_future_refresh"

    verification_status: "official_resource_page_verified_api_pending"

