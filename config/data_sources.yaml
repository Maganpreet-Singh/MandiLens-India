# -----------------------------------------------------------------------------
# 4. SOURCE PRIORITY AND DEPENDENCY MANAGEMENT
# -----------------------------------------------------------------------------

source_management:

  primary_source: "mandi_huggingface"

  source_priority_order:

    - "mandi_huggingface"

    - "data_gov_in"

    - "weather_data"

    - "agricultural_production"

    - "minimum_support_prices"

  fallback_policy:

    use_secondary_source_when_primary_fails: false

    require_schema_compatibility: true

    require_provenance_tracking: true

    require_source_comparison: true

    require_duplicate_detection: true

    never_silently_merge_sources: true

  source_conflicts:

    preserve_source_specific_records: true

    document_conflicting_values: true

    require_resolution_policy: true

    preserve_original_values: true


# -----------------------------------------------------------------------------
# 5. SOURCE MANIFEST CONFIGURATION
# -----------------------------------------------------------------------------

manifest:

  enabled: true

  output_directory: "data/metadata"

  formats:

    - "json"
    - "csv"

  default_manifest_name: "source_manifest"

  include_fields:

    - "source_id"

    - "source_name"

    - "provider"

    - "repository_id"

    - "repository_revision"

    - "remote_file_path"

    - "local_relative_path"

    - "file_format"

    - "file_size_bytes"

    - "sha256"

    - "download_timestamp"

    - "verification_status"

    - "row_count"

    - "schema_fingerprint"

  generation:

    create_manifest_before_download: true

    update_manifest_after_download: true

    preserve_previous_manifest: true

    record_failed_downloads: true

    record_validation_failures: true


# -----------------------------------------------------------------------------
# 6. DATASET INVENTORY CONFIGURATION
# -----------------------------------------------------------------------------

inventory:

  enabled: true

  output_directory: "data/metadata/mandi_india_daily_prices"

  generate_file_inventory: true

  generate_schema_inventory: true

  generate_row_count_inventory: true

  generate_date_range_inventory: true

  generate_geographical_inventory: true

  generate_commodity_inventory: true

  generate_file_size_inventory: true

  output_files:

    file_inventory: "file_inventory.csv"

    schema_inventory: "schema_inventory.json"

    dataset_summary: "dataset_summary.json"

    validation_summary: "validation_summary.json"


# -----------------------------------------------------------------------------
# 7. PROVENANCE AND AUDIT TRAIL
# -----------------------------------------------------------------------------

provenance:

  enabled: true

  record_source_url: true

  record_source_repository: true

  record_source_revision: true

  record_original_provider: true

  record_download_timestamp: true

  record_file_checksums: true

  record_transformations: true

  preserve_source_lineage: true

  audit_trail_directory: "data/metadata/audit"

  require_lineage_for_processed_data: true

  require_source_attribution_in_reports: true


# -----------------------------------------------------------------------------
# 8. CREDENTIALS AND SECURITY
# -----------------------------------------------------------------------------

credentials:

  use_environment_variables: true

  never_store_credentials_in_yaml: true

  never_commit_api_keys: true

  never_print_api_keys_in_logs: true

  environment_variables:

    huggingface_token: "HF_TOKEN"

    data_gov_in_api_key: "DATA_GOV_IN_API_KEY"

    weather_api_key: "WEATHER_API_KEY"

  secret_validation:

    validate_required_secrets_before_api_calls: true

    fail_when_required_secret_is_missing: true

    do_not_block_public_downloads_without_optional_tokens: true


# -----------------------------------------------------------------------------
# 9. SOURCE FAILURE HANDLING
# -----------------------------------------------------------------------------

failure_handling:

  retry_transient_network_errors: true

  maximum_retries: 5

  exponential_backoff: true

  retry_backoff_factor: 2

  record_failed_requests: true

  preserve_partially_downloaded_files: true

  resume_supported_downloads: true

  skip_corrupted_files_during_processing: false

  quarantine_corrupted_files: true

  quarantine_directory: "data/temp/quarantine"

  stop_pipeline_on_primary_source_failure: true

  stop_pipeline_on_integrity_failure: true

  continue_when_optional_source_is_unavailable: true


# -----------------------------------------------------------------------------
# 10. SOURCE ACCEPTANCE CRITERIA
# -----------------------------------------------------------------------------

acceptance_criteria:

  primary_dataset:

    repository_accessible: true

    complete_file_inventory_available: true

    all_expected_parquet_files_downloaded: true

    actual_row_count_calculated: true

    schema_inspected: true

    parquet_files_readable: true

    checksums_recorded: true

    source_revision_recorded: true

    source_provenance_documented: true

  official_sources:

    official_provider_identified: true

    source_endpoint_verified_before_use: true

    authentication_verified_before_use: true

    usage_terms_reviewed: true

    source_schema_inspected: true

