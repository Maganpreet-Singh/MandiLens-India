      catalog_url: >
        https://data.gov.in/catalog/current-daily-price-various-commodities-various-markets-mandi

      help_url: "https://data.gov.in/help"

      publisher: >
        Ministry of Agriculture and Farmers Welfare,
        Department of Agriculture and Farmers Welfare,
        Directorate of Marketing and Inspection

    resource:

      resource_name: "Variety-wise Daily Market Prices Data of Commodity"

      resource_id: null

      resource_id_verification: "pending"

      granularity: "daily"

      published_page_updated_date: "2026-10-24"

      observed_fields:

        - "State"
        - "District"
        - "Market"
        - "Commodity"
        - "Variety"

      access_contract_verified: false

    api:

      enabled: false

      endpoint: null

      resource_id: null

      api_key_required: true

      api_key_environment_variable: "DATA_GOV_IN_API_KEY"

      portal_registration_required_for_key: true

      request_api_if_unavailable: true

      api_documentation_verification_required: true

      pagination:

        enabled: false

        limit: null

        offset: null

      response_format: "json"

      rate_limit: null

      note: >
        Do not construct or call a resource API until its official
        endpoint, resource identifier, access permissions and
        pagination behavior have been verified.

    acquisition:

      enabled: false

      method: "official_api_or_portal_download"

      preserve_original_response: true

      record_retrieval_timestamp: true

      store_request_metadata: true

    storage:

      raw_directory: "data/raw/official_government_data"

      metadata_directory: "data/metadata/data_gov_in"

      response_manifest: "data/metadata/data_gov_in/manifest.json"

    attribution:

      provider: "Government of India"

      original_data_source: "AGMARKNET"

      attribution_required: true

    refresh:

      frequency: "daily_source_granularity"

      automatic_refresh: false

      require_api_verification: true

      require_data_overlap_checks: true


  # ===========================================================================
  # SOURCE 03 — WEATHER DATA INTEGRATION
  # ===========================================================================

  weather_data:

