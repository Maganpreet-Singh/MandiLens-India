          - "rmse"
          - "wape"
          - "smape"
          - "mase"
          - "mean_bias"

      horizon_comparison:
        enabled: true

        type: "bar"

        x: "forecast_horizon"

        y: "wape"

        group_by: "model_name"

      actual_vs_predicted:
        enabled: true

        type: "scatter"

        x: "actual_price"

        y: "predicted_price"

      residual_analysis:
        enabled: true

        histogram: true

        time_series: true

      segment_analysis:
        enabled: true

        dimensions:
