      format: "parquet"

      require_forecast_artifact: true

    controls:
      commodity_selection: true

      market_selection: true

      forecast_horizon_selection: true

      model_selection: true

    default_horizons:
      - 1
      - 7
      - 14
      - 30

    horizon_unit: "market_observation_steps"

    components:

      forecast_summary:
        enabled: true

        show_forecast_origin: true

        show_latest_observed_price: true

        show_predicted_price: true

        show_forecast_horizon: true

        show_model_name: true

        show_model_version: true

      forecast_chart:
        enabled: true

        type: "line"

        title: "Historical Prices and Future Forecast"

        historical_series:
          enabled: true

          color: "#78909C"

        forecast_series:
          enabled: true

          color: "#2E7D32"

        show_forecast_boundary: true

        show_forecast_points: true

        show_confidence_interval: false

      forecast_table:
        enabled: true

        columns:
          - "State"
          - "District"
          - "Market"
          - "Commodity"
          - "forecast_origin"
          - "forecast_timestamp"
          - "forecast_horizon"
          - "predicted_price"
          - "model_name"
          - "model_version"

      explanation:
        enabled: true

        display:
          - "Forecast is an estimate, not a guaranteed market price."
          - "Forecast quality depends on historical data and market behavior."
          - "Forecast horizon uses the configured market observation calendar."

      validation:
        reject_missing_model_artifact: true

        reject_invalid_forecast_records: true

        show_model_version: true

        show_forecast_timestamp: true

        distinguish_forecast_from_actual: true

    unavailable_state:
      show_explanation: true

      message: >
        Forecasts are not currently available for this selection.
        Check model training status, forecast artifact availability
        and historical data coverage.


# -----------------------------------------------------------------------------
# 18. FORECAST COMPARISON PAGE
# -----------------------------------------------------------------------------

  forecast_comparison:
    enabled: true

    route: "forecast-comparison"

    title: "Forecast Model Comparison"

    icon: "🧪"

    description: >
      Compare the performance of statistical and machine-learning models
      across commodities, markets and forecasting horizons.

    data_source:
      directory: "artifacts/models/evaluation"

    components:

      model_ranking:
        enabled: true

        type: "bar"

        ranking_metric: "wape"

        order: "ascending"

      metric_comparison:
        enabled: true

        metrics:
