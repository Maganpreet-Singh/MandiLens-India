    seasonality: 1800

    forecast_artifacts: 600

    model_evaluation: 900

    quality_reports: 900

  cache_data:
    enabled: true

    maximum_entries: 100

    show_spinner: true

  cache_resource:
    enabled: true

    use_for:
      - "duckdb_connection"
      - "loaded_model_metadata"
      - "reference_data"

  invalidation:
