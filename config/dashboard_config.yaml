    on_forecast_refresh: true

    on_model_version_change: true

    on_quality_report_update: true

  safeguards:
    include_active_filters_in_cache_key: true

    include_dataset_version_in_cache_key: true

    avoid_caching_user_specific_sensitive_data: true


# -----------------------------------------------------------------------------
# 28. PERFORMANCE AND SCALABILITY
# -----------------------------------------------------------------------------

performance:
  design_target:
    records: 75962937

    status: "approximate_volume_pending_local_verification"

  principles:
    - "The dashboard must not load all source rows into memory."
    - "Use DuckDB to aggregate and filter Parquet data."
    - "Use precomputed data marts for frequently requested metrics."
    - "Use Polars for high-volume data transformations."
    - "Keep dashboard queries narrow and predictable."
    - "Use caching for repeated queries and reference data."
    - "Use pagination for large detail tables."

  processing:
    full_dataset_loading: false

    use_lazy_queries: true

    use_preaggregation: true

    use_partition_pruning: true

    use_column_projection: true

  query_limits:
    default_timeout_seconds: 30

    maximum_timeout_seconds: 120

    maximum_result_rows: 100000

  chart_limits:
    maximum_line_chart_points: 5000

    maximum_bar_categories: 50

    maximum_scatter_points: 20000

