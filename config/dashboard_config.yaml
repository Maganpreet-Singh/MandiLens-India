
# =============================================================================
# MANDILENS INDIA
# Agricultural Market Analytics, Price Forecasting & Decision-Support Platform
#
# File: config/dashboard_config.yaml
# Version: 1.0.0
#
# Purpose:
#   Central configuration for the MandiLens India analytics dashboard.
#
# Dashboard responsibilities:
#   1. Agricultural market intelligence and overview.
#   2. Commodity price exploration.
#   3. State, district and market comparisons.
#   4. Historical price trend analysis.
#   5. Multi-horizon agricultural price forecasts.
#   6. Market and commodity performance analysis.
#   7. Data-quality monitoring.
#   8. Machine-learning model performance monitoring.
#   9. Downloadable analytical reports.
#
# Recommended technology:
#   Application: Streamlit
#   Visualization: Plotly
#   Analytical query engine: DuckDB
#   Data processing: Polars
#   Columnar storage: Parquet
#   Numerical operations: NumPy
#
# IMPORTANT:
#   Column names and dataset locations are candidate values.
#   Verify the actual downloaded dataset before enabling data-dependent pages.
#   Never load the entire raw dataset into Streamlit or Pandas memory.
# =============================================================================


# -----------------------------------------------------------------------------
# 1. CONFIGURATION METADATA
# -----------------------------------------------------------------------------

metadata:
  project_name: "MandiLens India"

  configuration_name: "dashboard_config"

  configuration_version: "1.0.0"

  environment: "development"

  description: >
    Central dashboard configuration for agricultural market analytics,
    historical commodity price exploration, price forecasting,
    data-quality monitoring and machine-learning insights.

  maintained_by: "MandiLens India Engineering Team"

  created_date: "2026-11-09"

  last_updated: "2026-11-09"

  configuration_status: "development"

  production_approved: false

  related_configurations:
    project: "config/project_config.yaml"
    data_sources: "config/data_sources.yaml"
    commodity_categories: "config/commodity_categories.yaml"
    data_quality: "config/data_quality.yaml"
    model_config: "config/model_config.yaml"


# -----------------------------------------------------------------------------
# 2. APPLICATION CONFIGURATION
# -----------------------------------------------------------------------------

application:
  name: "MandiLens India"

  short_name: "MandiLens"

  tagline: >
    Intelligent Agricultural Market Analytics,
    Price Forecasting and Decision Support.

  description: >
    An agricultural intelligence platform that transforms Indian
    agricultural market observations into actionable insights through
    interactive analytics, price trends, market comparisons and
    machine-learning-powered forecasts.

  framework:
    name: "streamlit"

    minimum_version: "1.35.0"

    version_policy: "pin_and_test_in_project_dependencies"

  entry_point:
    file: "app.py"

  execution:
    mode: "web_application"

    development_command: "streamlit run app.py"

    headless: true

    browser_auto_open: true

    watch_files: true

    development_hot_reload: true

  default_page:
    name: "Overview"

    route: "overview"

  browser:
    page_title: "MandiLens India | Agricultural Intelligence"

    page_icon: "🌾"

    layout: "wide"

    initial_sidebar_state: "expanded"

    show_toolbar: true

    enable_development_menu: true

  session:
    persistent_filters: true

    preserve_selected_page: true

    reset_filters_on_reload: false

    session_state_prefix: "mandilens_"


# -----------------------------------------------------------------------------
# 3. BRANDING AND VISUAL IDENTITY
# -----------------------------------------------------------------------------

branding:
  product_name: "MandiLens India"

  logo:
    enabled: true

    primary: "assets/images/logo.png"

    fallback_emoji: "🌾"

    show_in_sidebar: true

    show_in_header: true

  favicon:
    enabled: true

    path: "assets/images/favicon.png"

  theme:
    mode: "light"

    primary_color: "#2E7D32"

    background_color: "#F7F9F6"

    secondary_background_color: "#FFFFFF"

    text_color: "#263238"

    border_color: "#E0E6E1"

    accent_colors:
      agriculture_green: "#2E7D32"
      forest_green: "#1B5E20"
      harvest_gold: "#E6A23C"
      sky_blue: "#4B91C8"
      neutral_grey: "#78909C"
      warning_orange: "#F39C12"
      error_red: "#D9534F"

  typography:
    font_family: "sans-serif"

    heading_font_size: "large"

    body_font_size: "medium"

    use_consistent_font_scale: true

  design:
    style: "professional_analytics_dashboard"

    card_style: "clean_minimal"

    rounded_corners: true

    consistent_spacing: true

    consistent_chart_margins: true

    use_subtle_shadows: true

    avoid_visual_clutter: true

    responsive_layout: true

  visual_principles:
    - "Prioritize readability over decoration."
    - "Use consistent colors for recurring metrics."
    - "Avoid misleading chart scales."
    - "Display units on every relevant price chart."
    - "Clearly distinguish actual prices from forecasts."
    - "Use color and labels together to communicate status."
    - "Keep each page focused on a specific analytical task."


# -----------------------------------------------------------------------------
# 4. APPLICATION NAVIGATION
# -----------------------------------------------------------------------------

navigation:
  enabled: true

  position: "sidebar"

  mode: "multipage"

  show_page_icons: true

  show_descriptions: true

  show_active_page_indicator: true

  groups:

    primary:
      label: "Market Intelligence"

      pages:
        - "overview"
        - "market_explorer"
        - "commodity_explorer"

    analytics:
      label: "Analytics"

      pages:
        - "price_trends"
        - "market_comparison"
        - "seasonality"

    forecasting:
      label: "Forecasting"

      pages:
        - "price_forecasts"
        - "forecast_comparison"

    monitoring:
      label: "Monitoring"

      pages:
        - "data_quality"
        - "model_performance"

    information:
      label: "Platform"

      pages:
        - "about"
        - "data_documentation"

  default_page: "overview"

  page_visibility:
    overview: true
    market_explorer: true
    commodity_explorer: true
    price_trends: true
    market_comparison: true
    seasonality: true

    price_forecasts:
      enabled: true
      require_model_artifact: true

    forecast_comparison:
      enabled: true
      require_evaluation_data: true

    data_quality:
      enabled: true
      require_quality_reports: true

    model_performance:
      enabled: true
      require_model_evaluation: true

    about: true
    data_documentation: true


# -----------------------------------------------------------------------------
# 5. GLOBAL DATA CONFIGURATION
# -----------------------------------------------------------------------------

data:
  source:
    primary_engine: "duckdb"

    processing_engine: "polars"

    storage_format: "parquet"

    use_lazy_execution: true

    read_raw_files_directly_in_dashboard: false

  paths:
    # Adjust these paths to match the final project directory.
    processed_data: "data/processed"

    aggregated_data: "data/analytics"

    reference_data: "data/reference"

    forecast_data: "artifacts/forecasts"

    quality_reports: "reports/data_quality"

    model_evaluation: "artifacts/models/evaluation"

  dataset:
    logical_name: "validated_agricultural_market_prices"

    expected_scale:
      record_count: 75962937

      record_count_status: "publisher_or_user_reported_pending_local_verification"

    load_strategy: "query_on_demand"

    full_dataset_in_memory: false

    use_aggregated_tables: true

  candidate_schema:
    geography:
      state: "State"
      district: "District"
      market: "Market"

    commodity:
      commodity: "Commodity"
      variety: "Variety"
      grade: "Grade"
      commodity_code: "Commodity_Code"

    temporal:
      arrival_date: "Arrival_Date"

    price:
      minimum_price: "Min_Price"
      maximum_price: "Max_Price"
      modal_price: "Modal_Price"

    schema_status: "pending_local_dataset_verification"

  price:
    target_column: "Modal_Price"

    currency: "INR"

    unit: null

    unit_status: "pending_source_documentation"

    display_unit: "pending_source_documentation"

    decimal_places: 2

    thousands_separator: true

    negative_values_allowed: false

  geographic:
    country: "India"

    default_country: "India"

    map_coordinate_columns:
      latitude: "latitude"
      longitude: "longitude"

    coordinates_available: false

    coordinate_status: "reference_data_required"


# -----------------------------------------------------------------------------
# 6. DATA ACCESS AND QUERY STRATEGY
# -----------------------------------------------------------------------------

query_engine:
  enabled: true

  engine: "duckdb"

  connection:
    mode: "read_only"

    create_if_missing: true

    persistent_database:
      enabled: true

      path: "data/analytics/mandilens.duckdb"

  execution:
    use_parameterized_queries: true

    prevent_sql_string_concatenation_for_user_filters: true

    use_column_projection: true

    use_filter_pushdown: true

    use_partition_pruning: true

    use_aggregated_tables: true

    avoid_unnecessary_full_table_scans: true

  query_types:
    overview:
      use_precomputed_aggregates: true

    commodity:
      filter_before_aggregation: true

    market:
      filter_before_aggregation: true

    forecasts:
      read_model_forecast_artifacts: true

    data_quality:
      read_quality_reports: true

    model_performance:
      read_evaluation_artifacts: true

  query_safety:
    enforce_query_timeout: true

    timeout_seconds: 120

    maximum_result_rows: 100000

    reject_unbounded_detail_queries: true

    log_slow_queries: true

  error_policy:
    missing_table: "show_actionable_error"

    missing_column: "show_schema_mismatch_error"

    query_timeout: "show_retry_message"

    corrupted_data: "show_data_integrity_warning"


# -----------------------------------------------------------------------------
# 7. ANALYTICAL DATA MARTS
# -----------------------------------------------------------------------------

data_marts:
  enabled: true

  purpose: >
    Provide dashboard-ready analytical datasets so that interactive pages
    do not repeatedly scan and aggregate the complete raw dataset.

  storage_format: "parquet"

  recommended_structure:

    market_prices:
      logical_name: "market_prices"

      description: >
        Validated market-level commodity price observations.

      grain:
        - "State"
        - "District"
        - "Market"
        - "Commodity"
        - "Arrival_Date"

      source: "validated_agricultural_market_prices"

    daily_market_summary:
      logical_name: "daily_market_summary"

      description: "Aggregated daily market price statistics."

      candidate_metrics:
        - "observation_count"
        - "average_modal_price"
        - "median_modal_price"
        - "minimum_price"
        - "maximum_price"

      group_by:
        - "Arrival_Date"
        - "State"
        - "Commodity"

    commodity_summary:
      logical_name: "commodity_summary"

      description: "Commodity-level analytical summary."

      group_by:
        - "Commodity"

      candidate_metrics:
        - "observation_count"
        - "market_count"
        - "average_modal_price"
        - "median_modal_price"

    market_summary:
      logical_name: "market_summary"

      description: "Market-level analytical summary."

      group_by:
        - "State"
        - "District"
        - "Market"

      candidate_metrics:
        - "observation_count"
        - "commodity_count"
        - "average_modal_price"

    state_summary:
      logical_name: "state_summary"

      description: "State-level agricultural market summary."

      group_by:
        - "State"

      candidate_metrics:
        - "market_count"
        - "commodity_count"
        - "observation_count"

  creation:
    enabled: true

    pipeline_location: "src/analytics/data_mart_builder.py"

    refresh_mode: "scheduled_or_manual"

    full_rebuild_required_for_schema_change: true

    incremental_refresh: true

    validate_before_publish: true

  publication:
    only_publish_validated_data: true

    retain_previous_successful_snapshot: true

    record_data_version: true


# -----------------------------------------------------------------------------
# 8. GLOBAL FILTER CONFIGURATION
# -----------------------------------------------------------------------------

filters:
  enabled: true

  location: "sidebar"

  layout: "vertical"

  display_mode: "expandable"

  show_active_filter_summary: true

  allow_multiple_selections: true

  allow_clear_all: true

  preserve_filters_across_pages: true

  filters:

    state:
      enabled: true

      label: "State"

      column: "State"

      type: "multiselect"

      default: "all"

      searchable: true

      required: false

    district:
      enabled: true

      label: "District"

      column: "District"

      type: "multiselect"

      default: "all"

      searchable: true

      dependent_on:
        - "state"

      required: false

    market:
      enabled: true

      label: "Market"

      column: "Market"

      type: "multiselect"

      default: "all"

      searchable: true

      dependent_on:
        - "state"
        - "district"

      required: false

    commodity:
      enabled: true

      label: "Commodity"

      column: "Commodity"

      type: "multiselect"

      default: "all"

      searchable: true

      required: false

    variety:
      enabled: true

      label: "Variety"

      column: "Variety"

      type: "multiselect"

      default: "all"

      searchable: true

      dependent_on:
        - "commodity"

      required: false

    grade:
      enabled: true

      label: "Grade"

      column: "Grade"

      type: "multiselect"

      default: "all"

      searchable: true

      dependent_on:
        - "commodity"

      required: false

    arrival_date:
      enabled: true

      label: "Arrival Date"

      column: "Arrival_Date"

      type: "date_range"

      default: "available_dataset_range"

      minimum_date: null

      maximum_date: "latest_available_date"

      required: false

  interaction:
    apply_button: true

    reset_button: true

    update_on_every_change: false

    update_on_apply: true

  dependency_rules:
    enabled: true

    recompute_child_options: true

    reset_invalid_child_values: true

    prevent_unfiltered_high_cardinality_options: true

  filtering:
    use_parameterized_queries: true

    apply_filters_before_aggregation: true

    preserve_filter_context_in_exports: true


# -----------------------------------------------------------------------------
# 9. DATE FILTER AND TIME CONTROLS
# -----------------------------------------------------------------------------

date_controls:
  enabled: true

  default_selection: "available_dataset_range"

  supported_presets:
    - "last_7_days"
    - "last_30_days"
    - "last_90_days"
    - "last_6_months"
    - "last_12_months"
    - "year_to_date"
    - "all_available_dates"
    - "custom_range"

  default_preset: "last_12_months"

  date_column: "Arrival_Date"

  date_timezone: "Asia/Kolkata"

  comparison:
    enabled: true

    options:
      - "previous_period"
      - "previous_year"

    require_equal_period_length: true

  missing_dates:
    display_missing_observation_gaps: true

    assume_zero_price: false

    forward_fill_for_visualization: false

    distinguish_no_observation_from_zero_price: true

  chart_resolution:
    automatic: true

    options:
      - "daily"
      - "weekly"
      - "monthly"

    maximum_daily_points: 5000

    use_downsampling_for_long_ranges: true


# -----------------------------------------------------------------------------
# 10. DASHBOARD-WIDE KPI CONFIGURATION
# -----------------------------------------------------------------------------

kpis:
  enabled: true

  layout:
    desktop_columns: 4

    tablet_columns: 2

    mobile_columns: 1

    card_style: "minimal"

    show_tooltips: true

    show_context_labels: true

  formatting:
    decimal_places: 2

    compact_large_numbers: true

    thousands_separator: true

    null_display: "N/A"

  metrics:

    total_observations:
      enabled: true

      label: "Total Observations"

      aggregation: "count"

      source: "market_prices"

      format: "integer"

      description: "Number of eligible market price observations."

    total_states:
      enabled: true

      label: "States Covered"

      source: "market_prices"

      aggregation: "distinct_count"

      column: "State"

      format: "integer"

    total_markets:
      enabled: true

      label: "Markets Covered"

      source: "market_prices"

      aggregation: "distinct_count"

      column: "Market"

      format: "integer"

    total_commodities:
      enabled: true

      label: "Commodities Tracked"

      source: "market_prices"

      aggregation: "distinct_count"

      column: "Commodity"

      format: "integer"

    latest_arrival_date:
      enabled: true

      label: "Latest Arrival Date"

      source: "market_prices"

      aggregation: "max"

      column: "Arrival_Date"

      format: "date"

    average_modal_price:
      enabled: true

      label: "Average Modal Price"

      source: "market_prices"

      aggregation: "mean"

      column: "Modal_Price"

      format: "price"

      unit: "inherit_from_data_configuration"

    median_modal_price:
      enabled: true

      label: "Median Modal Price"

      source: "market_prices"

      aggregation: "median"

      column: "Modal_Price"

      format: "price"

    active_markets:
      enabled: true

      label: "Markets Reporting"

      description: >
        Markets with valid observations inside the selected date period.

      calculation: "distinct_market_count_with_observations"

    percentage_change:
      enabled: true

      label: "Price Change"

      calculation: "period_over_period_percentage_change"

      comparison_required: true

      zero_denominator_policy: "return_na"

  validation:
    exclude_invalid_prices: true

    respect_global_filters: true

    record_aggregation_timestamp: true

    prevent_inconsistent_denominators: true


# -----------------------------------------------------------------------------
# 11. OVERVIEW PAGE
# -----------------------------------------------------------------------------

pages:

  overview:
    enabled: true

    route: "overview"

    title: "Agricultural Market Overview"

    icon: "🌾"

    description: >
      A high-level view of India's agricultural market activity,
      commodity prices and reporting coverage.

    layout:
      width: "wide"

      sections:
        - "page_header"
        - "global_filters"
        - "overview_kpis"
        - "market_activity"
        - "price_movement"
        - "commodity_highlights"
        - "geographical_distribution"
        - "recent_market_records"

    components:

      header:
        enabled: true

        show_project_title: true

        show_description: true

        show_last_updated: true

      kpis:
        enabled: true

        metrics:
          - "total_observations"
          - "total_states"
          - "total_markets"
          - "total_commodities"

      market_activity_chart:
        enabled: true

        type: "line"

        title: "Market Reporting Activity"

        x: "Arrival_Date"

        y: "observation_count"

        aggregation: "daily"

      price_movement_chart:
        enabled: true

        type: "line"

        title: "Average Modal Price Trend"

        x: "Arrival_Date"

        y: "average_modal_price"

        aggregation: "daily"

      commodity_highlights:
        enabled: true

        type: "bar"

        title: "Top Commodities by Market Coverage"

        ranking_metric: "market_count"

        limit: 10

      geographical_distribution:
        enabled: true

        type: "bar"

        title: "Market Coverage by State"

        group_by: "State"

        ranking_metric: "market_count"

        limit: 15

      recent_market_records:
        enabled: true

        title: "Recent Market Observations"

        limit: 20

        sort_order: "descending"

        sort_by: "Arrival_Date"

        require_pagination: true


# -----------------------------------------------------------------------------
# 12. MARKET EXPLORER PAGE
# -----------------------------------------------------------------------------

  market_explorer:
    enabled: true

    route: "market-explorer"

    title: "Market Explorer"

    icon: "🏪"

    description: >
      Explore agricultural markets across states and districts,
      inspect available commodities and examine local market prices.

    layout:
      width: "wide"

      sections:
        - "market_filters"
        - "market_summary"
        - "market_price_distribution"
        - "market_records"
        - "market_ranking"

    filters:
      use_global_filters: true

      additional:
        state: true
        district: true
        market: true
        commodity: true
        arrival_date: true

    components:

      market_summary:
        enabled: true

        show_market_count: true

        show_commodity_count: true

        show_average_modal_price: true

        show_latest_arrival_date: true

      price_distribution:
        enabled: true

        type: "box"

        title: "Market Price Distribution"

        y: "Modal_Price"

        x: "Market"

        maximum_categories: 20

      market_ranking:
        enabled: true

        title: "Market Price Ranking"

        ranking_metric: "average_modal_price"

        order: "descending"

        limit: 20

      market_records:
        enabled: true

        enable_search: true

        enable_sorting: true

        enable_pagination: true

        default_page_size: 50

        maximum_page_size: 500


# -----------------------------------------------------------------------------
# 13. COMMODITY EXPLORER PAGE
# -----------------------------------------------------------------------------

  commodity_explorer:
    enabled: true

    route: "commodity-explorer"

    title: "Commodity Explorer"

    icon: "🌱"

    description: >
      Analyze agricultural commodity prices, market availability,
      price ranges and historical movements.

    layout:
      width: "wide"

      sections:
        - "commodity_selection"
        - "commodity_summary"
        - "commodity_price_history"
        - "commodity_market_ranking"
        - "commodity_price_distribution"
        - "commodity_records"

    filters:
      use_global_filters: true

      commodity_required: true

      allow_multiple_commodities: false

      allow_variety_filter: true

      allow_grade_filter: true

    components:

      summary:
        enabled: true

        metrics:
          - "average_modal_price"
          - "median_modal_price"
          - "minimum_price"
          - "maximum_price"
          - "market_count"
          - "latest_arrival_date"

      price_history:
        enabled: true

        type: "line"

        title: "Historical Commodity Price"

        x: "Arrival_Date"

        y: "Modal_Price"

        group_by: "Market"

        maximum_market_series: 10

      price_distribution:
        enabled: true

        type: "histogram"

        title: "Commodity Price Distribution"

        x: "Modal_Price"

        bins: 40

      market_ranking:
        enabled: true

        title: "Markets by Average Modal Price"

        ranking_metric: "average_modal_price"

        order: "descending"

        limit: 20

      commodity_records:
        enabled: true

        pagination: true

        default_page_size: 50


# -----------------------------------------------------------------------------
# 14. PRICE TRENDS PAGE
# -----------------------------------------------------------------------------

  price_trends:
    enabled: true

    route: "price-trends"

    title: "Price Trend Analysis"

    icon: "📈"

    description: >
      Study historical agricultural price movements and identify
      periods of growth, decline and unusual price behavior.

    components:

      historical_trend:
        enabled: true

        type: "line"

        title: "Historical Price Trend"

        x: "Arrival_Date"

        y: "Modal_Price"

        aggregation_options:
          - "daily"
          - "weekly"
          - "monthly"

      price_range:
        enabled: true

        type: "area"

        title: "Minimum, Modal and Maximum Price"

        lower_column: "Min_Price"

        middle_column: "Modal_Price"

        upper_column: "Max_Price"

      percentage_change:
        enabled: true

        type: "bar"

        title: "Price Change Over Time"

        calculation: "period_over_period_percentage_change"

      rolling_average:
        enabled: true

        type: "line"

        title: "Rolling Price Average"

        windows:
          - 7
          - 14
          - 30

        calculation_unit: "observations"

      volatility:
        enabled: true

        type: "line"

        title: "Rolling Price Volatility"

        metric: "rolling_standard_deviation"

        window: 14

      controls:
        show_trendline: true

        show_rolling_average: true

        allow_time_aggregation: true

        allow_market_comparison: true


# -----------------------------------------------------------------------------
# 15. MARKET COMPARISON PAGE
# -----------------------------------------------------------------------------

  market_comparison:
    enabled: true

    route: "market-comparison"

    title: "Market Comparison"

    icon: "⚖️"

    description: >
      Compare commodity prices across different agricultural markets,
      districts and states.

    comparison:
      minimum_entities: 2

      maximum_entities: 10

      entity_type:
        - "Market"
        - "District"
        - "State"

      default_entity_type: "Market"

    components:

      comparison_chart:
        enabled: true

        type: "line"

        title: "Price Comparison Across Markets"

        x: "Arrival_Date"

        y: "average_modal_price"

        group_by: "comparison_entity"

      comparison_table:
        enabled: true

        columns:
          - "comparison_entity"
          - "average_modal_price"
          - "median_modal_price"
          - "minimum_modal_price"
          - "maximum_modal_price"
          - "observation_count"

      price_spread:
        enabled: true

        type: "bar"

        title: "Price Difference Between Selected Markets"

        calculation: "maximum_minus_minimum_average_price"

      comparison_rules:
        require_same_commodity: true

        use_common_date_window: true

        handle_different_observation_counts: true

        display_sample_counts: true


# -----------------------------------------------------------------------------
# 16. SEASONALITY ANALYSIS PAGE
# -----------------------------------------------------------------------------

  seasonality:
    enabled: true

    route: "seasonality"

    title: "Seasonality Analysis"

    icon: "🗓️"

    description: >
      Analyze recurring price behavior across months, quarters
      and available historical periods.

    components:

      monthly_pattern:
        enabled: true

        type: "line"

        title: "Average Price by Month"

        group_by: "month"

        aggregation: "mean"

      monthly_heatmap:
        enabled: true

        type: "heatmap"

        title: "Commodity Price Seasonality"

        x: "month"

        y: "year"

        value: "average_modal_price"

      yearly_comparison:
        enabled: true

        type: "line"

        title: "Year-over-Year Price Comparison"

        x: "month"

        y: "average_modal_price"

        group_by: "year"

      statistical_summary:
        enabled: true

        metrics:
          - "monthly_mean"
          - "monthly_median"
          - "monthly_standard_deviation"

      requirements:
        minimum_historical_years: 2

        show_observation_coverage: true

        distinguish_missing_periods: true

        do_not_claim_causality: true


# -----------------------------------------------------------------------------
# 17. PRICE FORECASTS PAGE
# -----------------------------------------------------------------------------

  price_forecasts:
    enabled: true

    route: "price-forecasts"

    title: "Agricultural Price Forecasts"

    icon: "🔮"

    description: >
      Explore machine-learning-generated agricultural commodity price
      forecasts for selected markets and forecasting horizons.

    data_source:
