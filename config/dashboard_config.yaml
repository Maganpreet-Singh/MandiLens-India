        show_missing_count: true

        show_missing_percentage: true

      duplicate_analysis:
        enabled: true

        show_duplicate_candidates: true

        show_resolution_status: true

      anomaly_analysis:
        enabled: true

        show_suspicious_price_records: true

        require_review_status: true

      validation_history:
        enabled: true

        show_execution_timestamp: true

        show_dataset_version: true

        show_validation_status: true

    safety:
